version: "3.9"

services:
  dashboard:
    build:
      context: .
      dockerfile: dashboard.Dockerfile
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    volumes:
      - .:/app
      - state:/app/state
    environment:
      STATE_SIMA_PATH: ${STATE_SIMA_PATH:-state/sima}
      STATE_SHARED_PATH: ${STATE_SHARED_PATH:-state/shared}
      DASHBOARD_PORT: "8080"
    restart: unless-stopped
    networks:
      - hub-network

  sima:
    profiles: ["sima"]
    image: sima:latest
    volumes:
      - sima_src:/app/src
    depends_on: [dashboard]

  candash:
    profiles: ["candash"]
    image: candash:latest
    volumes:
      - candash_src:/app/src
    depends_on: [dashboard]

  # === Answer Pipeline (TASK-ANSWER-NNN) ===
  # Independent answer namespace: image processor + form processor.
  # Runs via: docker compose --profile answer up
  # Does not modify existing sima/candash services or lifecycle.
  answer-image-processor:
    profiles: ["answer", "analytics"]
    build:
      context: .
      dockerfile: dashboard.Dockerfile
    ports:
      - "${ANSWER_IMAGE_PROCESSOR_PORT:-9090}:8080"
    volumes:
      - ./state/answer:/app/state/answer
      - ./resources:/app/resources
    environment:
      STATE_ANSWER_PATH: ${STATE_ANSWER_PATH:-state/answer}
      PROJECT_ROOT: ${PROJECT_ROOT:-/app}
      ANSWER_OUTPUT_PATH: ${ANSWER_OUTPUT_PATH:-state/answer/output}
    restart: unless-stopped
    networks:
      - hub-network

  answer-form-processor:
    profiles: ["answer", "analytics"]
    build:
      context: .
      dockerfile: dashboard.Dockerfile
    ports:
      - "${ANSWER_FORM_PROCESSOR_PORT:-9091}:8080"
    volumes:
      - ./state/answer:/app/state/answer
      - ./resources:/app/resources
    environment:
      STATE_ANSWER_PATH: ${STATE_ANSWER_PATH:-state/answer}
      PROJECT_ROOT: ${PROJECT_ROOT:-/app}
      ANSWER_OUTPUT_PATH: ${ANSWER_OUTPUT_PATH:-state/answer/output}
    restart: unless-stopped
    networks:
      - hub-network

  prompt-docs:
    image: python:3.12-slim
    working_dir: /workspace
    command: >
      bash -lc "pip install --no-cache-dir fastapi uvicorn && uvicorn mimo_prompt_server:app --host 0.0.0.0 --port 8002"
    ports:
      - "${PROMPT_DOCS_PORT:-8002}:8002"
    volumes:
      - /home/hamid/Projects/omr_pipeline/answers:/workspace
    environment:
      MIMO_PROMPT_ROOT: /workspace
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    networks:
      - hub-network

  dashboard-db:
    image: postgres:16-alpine
    profiles: ["db"]
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - hub-network

volumes:
  state:
  sima_src:
  candash_src:
  db_data:
  answer_images:
  answer_forms:

networks:
  hub-network:
    driver: bridge
