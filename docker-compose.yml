version: "3.9"

services:
  dashboard:
    build:
      context: .
      dockerfile: dashboard.Dockerfile
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    volumes:
      - .:/app
      - state:/app/state
    environment:
      STATE_SIMA_PATH: ${STATE_SIMA_PATH:-state/sima}
      STATE_SHARED_PATH: ${STATE_SHARED_PATH:-state/shared}
      DASHBOARD_PORT: "8080"
    restart: unless-stopped
    networks:
      - hub-network

  sima:
    profiles: ["sima"]
    image: sima:latest
    volumes:
      - sima_src:/app/src
    depends_on: [dashboard]

  candash:
    profiles: ["candash"]
    image: candash:latest
    volumes:
      - candash_src:/app/src
    depends_on: [dashboard]

  dashboard-db:
    image: postgres:16-alpine
    profiles: ["db"]
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - hub-network

volumes:
  state:
  sima_src:
  candash_src:
  db_data:

networks:
  hub-network:
    driver: bridge
