# GitLab CI Configuration for Git-Swarm Protocol Enforcement
# Place in .gitlab/ci/protocol.yml and include in .gitlab-ci.yml

stages:
  - validate

protocol_validation:
  stage: validate
  image: node:20-alpine
  before_script:
    - apk add --no-cache git
    - npm ci --prefer-offline --no-audit
  script:
    - node scripts/validate_all.js
  artifacts:
    reports:
      junit: validation-report.xml
    when: always
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_PIPELINE_SOURCE == "web"
  timeout: 10m

# Optional: Generate JUnit report from validation output
# Add this to validate_all.js or create a wrapper script

# Protected Branches Configuration (Settings → Repository → Protected Branches):
# Main branch:
#   - Allowed to merge: Maintainers
#   - Allowed to push: No one
#   - Required approvals: 1
#   - Require pipeline to succeed: Yes
#
# Develop branch:
#   - Allowed to merge: Developers + Maintainers
#   - Allowed to push: No one
#   - Required approvals: 1
#   - Require pipeline to succeed: Yes

# Environment Protection (Settings → CI/CD → Environments):
# staging:
#   - Required approval: 1 (from QA team)
#   - Wait timer: 5 minutes
#
# production:
#   - Required approval: 1 (from Release team)
#   - Wait timer: 10 minutes
#   - Protected branch only: true