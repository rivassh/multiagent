name: Git-Swarm Protocol Enforcement

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch: {}

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  validate-protocol:
    name: Validate Protocol
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for transition validation
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      
      - name: Run protocol validation
        id: validation
        run: |
          echo "validation_output<<EOF" >> $GITHUB_OUTPUT
          node scripts/validate_all.js 2>&1 | tee /tmp/validation.log
          echo "${PIPESTATUS[0]}" > /tmp/exit_code
          cat /tmp/validation.log >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Check validation result
        run: |
          exit_code=$(cat /tmp/exit_code)
          if [ "$exit_code" -ne 0 ]; then
            echo "❌ Protocol validation failed"
            exit $exit_code
          fi
          echo "✅ Protocol validation passed"
      
      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-validation-log
          path: /tmp/validation.log
          retention-days: 7
      
      - name: Report status to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/validation.log', 'utf8');
            const passed = log.includes('✅ Protocol validation passed');
            
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Git-Swarm Protocol',
              head_sha: context.sha,
              status: 'completed',
              conclusion: passed ? 'success' : 'failure',
              output: {
                title: 'Protocol Validation',
                summary: passed ? 'All protocol checks passed' : 'Protocol violations detected',
                text: `\`\`\`\n${log.slice(-3000)}\n\`\`\``
              }
            });

  # Optional: Auto-label PR based on task status changes
  label-pr:
    name: Auto-label PR
    needs: validate-protocol
    if: github.event_name == 'pull_request' && success()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci --prefer-offline --no-audit
      - name: Label PR by task status
        run: |
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            
            // Get changed tasks.json files
            const diff = execSync('git diff --name-only origin/main..HEAD', { encoding: 'utf8' });
            const taskFiles = diff.split('\\n').filter(f => f.match(/state\\/(sima|candash|shared)\\/tasks\\.json/));
            
            if (taskFiles.length === 0) {
              console.log('No task file changes');
              process.exit(0);
            }
            
            const labels = new Set();
            
            for (const file of taskFiles) {
              const content = fs.readFileSync(file, 'utf8');
              const data = JSON.parse(content);
              
              for (const task of data.tasks || []) {
                switch (task.status) {
                  case 'NEEDS_QA': labels.add('needs-qa'); break;
                  case 'QA_PASSED': labels.add('qa-passed'); break;
                  case 'QA_FAILED': labels.add('qa-failed'); break;
                  case 'NEEDS_REVIEW': labels.add('needs-review'); break;
                  case 'IN_REVIEW': labels.add('in-review'); break;
                  case 'REVISE': labels.add('needs-revision'); break;
                  case 'DONE': labels.add('done'); break;
                  case 'STAGE_VERIFIED': labels.add('stage-verified'); break;
                }
              }
            }
            
            if (labels.size > 0) {
              const labelArgs = Array.from(labels).map(l => '--add-label=' + l).join(' ');
              execSync(\`gh pr edit \${process.env.GITHUB_REF_NAME} \${labelArgs}\`, { stdio: 'inherit' });
              console.log('Applied labels:', Array.from(labels).join(', '));
            }
          "
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.head_ref }}

  # Optional: Notify on protocol violation
  notify-failure:
    name: Notify Failure
    needs: validate-protocol
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create issue for protocol violation
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/validation.log', 'utf8');
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Protocol Validation Failed',
              body: `Protocol validation failed on \`${context.ref}\` (${context.sha.slice(0,8)}).\n\n\`\`\`\n${log.slice(-5000)}\n\`\`\`\n\nPlease review and fix protocol violations.`,
              labels: ['protocol-violation', 'blocked'],
              assignees: [context.actor]
            });
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}